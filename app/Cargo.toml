[package]
name = "opendock"
description = "Lightweight controller for AJAZZ Stream Dock devices"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ajazz-hid = { path = "../crates/ajazz-hid" }
image = { workspace = true, features = ["png", "bmp", "gif", "ico", "webp"] }
ab_glyph = "0.2"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
